<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin Tap — Import Test</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">JABALI IMPORT TEST · v1.0</p>
    <h1>Coin Tap</h1>
    <p>Collect five coins to win. Click, tap, or focus the coin and press Enter.</p>
    <p id="status" role="status" aria-live="polite">Coins: 0 / 5</p>
    <div id="arena">
      <button id="coin" aria-label="Collect coin"><img src="assets/coin.svg" alt="" draggable="false"></button>
    </div>
    <button id="restart">Restart game</button>
    <p class="footnote">No downloads. No dependencies. Ready to play.</p>
  </main>
</body>
</html>
